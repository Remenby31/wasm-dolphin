name: windows WARP (WebGPU on D3D12, correctness, manual)

# Chrome on Windows runs WebGPU on D3D12 only: Tint translates WGSL to HLSL,
# DXC compiles it. No PC is on the bench, and a GitHub Windows runner has no
# GPU. The job records which WebGPU adapter Chrome gives a page without
# flags and with --enable-unsafe-webgpu (for this job only), then runs the
# matrix on that adapter: harness/matrices/windows-warp.json compares
# video=wgpu with the exact software renderer on our homebrews. Correctness
# only: WARP times say nothing about a GPU.
#
# Manual only (workflow_dispatch), never on pull requests. No ROM: the
# homebrews are built from this repository's sources by the first job.
# Third-party actions are pinned by commit SHA, as in core-build.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the homebrews (pinned devkitPPC image)
        run: sh harness/homebrew/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrews
          path: harness/homebrew/out/*.iso
          retention-days: 3

  warp:
    needs: homebrews
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrews
          path: harness/homebrew/out
      - name: Playwright (driver only; the runner's Chrome stable is used)
        run: npm i -g playwright@1.56.1
      # First run (2026-10-23): without flags, headless Chrome 156 on this
      # GPU-less runner gives a SwiftShader fallback adapter (Vulkan), not
      # null. Recorded, not judged: which adapter each setting gives.
      - name: "No flag: the adapter a GPU-less Windows Chrome gives"
        run: node harness/probes/webgpu-adapter.mjs --port 8102 --out webgpu-adapter-default.json
      - name: "With --enable-unsafe-webgpu"
        env:
          HARNESS_CHROME_ARGS: --enable-unsafe-webgpu
        run: node harness/probes/webgpu-adapter.mjs --port 8102 --expect adapter --out webgpu-adapter-unsafe.json
      - name: "With --enable-unsafe-webgpu --use-webgpu-adapter=d3d12 (WARP?)"
        continue-on-error: true
        env:
          HARNESS_CHROME_ARGS: --enable-unsafe-webgpu --use-webgpu-adapter=d3d12
        run: node harness/probes/webgpu-adapter.mjs --port 8102 --expect adapter --out webgpu-adapter-d3d12.json
      - name: wgpu on WARP against the exact software renderer
        env:
          HARNESS_CHROME_ARGS: --enable-unsafe-webgpu
        run: node harness/cli.mjs matrix harness/matrices/windows-warp.json --port 8102
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-warp-results
          path: |
            webgpu-adapter-*.json
            harness/results/
          retention-days: 14
