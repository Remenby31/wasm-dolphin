name: core build (Linux, reproducible)

# Rebuilds the WASM core from pinned inputs in tools/toolchain/Dockerfile,
# installs it in the workspace, runs the JS checks and tests on it, and
# publishes it (artifact core-<sha256>) with the GPL corresponding source. A
# second job rebuilds the core from that source archive alone and must get the
# same bytes. On main, a third job commits the core: pull requests change
# sources only, and the committed core always comes from here
# (docs/repro-build.md, "Who builds the committed core"). No ROM is used
# anywhere.
#
# Third-party actions are pinned by commit SHA (the tag is in the comment):
# re-running a commit runs the same code.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: core-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    outputs:
      wasm_sha256: ${{ steps.clean.outputs.wasm_sha256 }}
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The guard below needs the merge base with the target branch.
          fetch-depth: 0

      # The toolchain image (~5 GB), vendor/dolphin and the CMake tree do not
      # fit next to the preinstalled SDKs.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0

      # Pull requests must not carry a rebuilt core. Warns until the repository
      # variable CORE_ARTIFACTS_GUARD is set to "enforce".
      - name: No core binaries in the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE: origin/${{ github.base_ref }}
          MODE: ${{ vars.CORE_ARTIFACTS_GUARD == 'enforce' && 'enforce' || 'warn' }}
        run: node tools/core-artifacts.mjs check --base "$BASE" --mode "$MODE"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The image tag is the content hash build-core-repro.mjs computes, so the
      # run step below finds the image and does not rebuild it.
      - name: Image tag
        id: image
        run: echo "tag=$(node tools/build-core-repro.mjs --docker-context)" >> "$GITHUB_OUTPUT"

      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: build/docker-context
          file: build/docker-context/tools/toolchain/Dockerfile
          tags: ${{ steps.image.outputs.tag }}
          load: true
          cache-from: type=gha,scope=toolchain
          cache-to: type=gha,mode=max,scope=toolchain

      - name: Rebuild the core from scratch
        id: clean
        run: |
          start=$(date +%s)
          npm run build:core:repro -- --docker --bind-mounts --clean --jobs "$(nproc)"
          echo "CLEAN_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "wasm_sha256=$(node -p "require('./build/repro/linux-x64/parity.json').rebuilt.wasmSha256")" >> "$GITHUB_OUTPUT"

      # Recompiling one translation unit and relinking must give the same
      # bytes: anything else is non-determinism in the build.
      - name: Incremental rebuild must match the clean build
        run: |
          touch core/upstream/dolphin_web_discio.cpp
          start=$(date +%s)
          npm run build:core:repro -- --docker --bind-mounts --no-sync --jobs "$(nproc)"
          echo "INCREMENTAL_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          incremental=$(node -p "require('./build/repro/linux-x64/parity.json').rebuilt.wasmSha256")
          if [ "$incremental" != "${{ steps.clean.outputs.wasm_sha256 }}" ]; then
            echo "::error::incremental build $incremental differs from clean build ${{ steps.clean.outputs.wasm_sha256 }}"
            exit 1
          fi

      # Tests run on the core built here, not on the committed one, so a pull
      # request that changes the C++ is tested against its own core.
      - name: Install the rebuilt core in the workspace
        run: |
          npm run build:core:repro -- --docker --bind-mounts --no-sync --install --jobs "$(nproc)"
          sudo chown -R "$(id -u):$(id -g)" cores provenance src
          node tools/core-artifacts.mjs status --require-current
          git status --short

      - name: npm run check
        run: npm run check

      - name: npm test
        run: npm test

      # Source-contract tests read the patched vendor/dolphin the build left.
      - name: npm run test:contract
        run: npm run test:contract

      # Vendoring the crates needs the pinned cargo, which lives in the image.
      - name: GPL corresponding source
        run: |
          docker run --rm -v "$PWD:/wasm-dolphin" "${{ steps.image.outputs.tag }}" \
            sh -c 'npm run dist:source && chown -R "$0" dist tools/naga-spirv-wgsl/vendor' "$(id -u):$(id -g)"

      - name: Summary
        run: |
          {
            echo "### Core rebuild (linux-x64)"
            echo "- clean build: ${CLEAN_BUILD_SECONDS}s, incremental: ${INCREMENTAL_BUILD_SECONDS}s (same hash)"
            node -e "
              const p=require('./build/repro/linux-x64/parity.json');
              console.log('- rebuilt wasm: \`sha256:'+p.rebuilt.wasmSha256+'\` ('+p.rebuilt.wasmBytes+' bytes)');
              console.log('- committed wasm: \`sha256:'+p.committed.wasmSha256+'\`');
              console.log('- sections equal: '+p.sections.filter(s=>s.equal).map(s=>s.label).join(', '));"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: corresponding-source
          path: dist/*.tar.gz
          if-no-files-found: error

      # Everything a core install rewrites, under the core's hash:
      # `npm run core:fetch -- <sha256> --repo <owner/name>` finds it.
      - name: Stage the core artifact
        run: |
          mkdir -p build/core-artifact
          cp cores/dolphin/dolphin-core-upstream.* provenance/dolphin-core-abi-v1.json \
            src/upstream-worker-protocol.js build/repro/linux-x64/parity.json build/core-artifact/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-${{ steps.clean.outputs.wasm_sha256 }}
          path: build/core-artifact/
          if-no-files-found: error
          retention-days: 90

  # The published archive must be enough to rebuild the core: no checkout, no
  # git, no network for sources (the Rust crates are vendored in it). Only the
  # toolchain is installed, from the lock inside the archive.
  rebuild-from-source-archive:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions: {}
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: corresponding-source
          path: archive

      - name: Extract
        run: |
          mkdir source
          tar -xzf archive/*.tar.gz -C source --strip-components=1
          test ! -e source/.git
          test -f source/src/app.js
          test -d source/tools/naga-spirv-wgsl/vendor/naga-26.0.0
          test "$(cd source && node tools/build-core-repro.mjs --docker-context)" = "${{ needs.build.outputs.image_tag }}"

      - name: Toolchain image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: source/build/docker-context
          file: source/build/docker-context/tools/toolchain/Dockerfile
          tags: ${{ needs.build.outputs.image_tag }}
          load: true
          cache-from: type=gha,scope=toolchain

      - name: Rebuild from the archive and compare
        working-directory: source
        run: |
          npm run build:core:repro -- --docker --bind-mounts --no-sync --clean --jobs "$(nproc)"
          rebuilt=$(node -p "require('./build/repro/linux-x64/parity.json').rebuilt.wasmSha256")
          echo "archive build: $rebuilt, checkout build: ${{ needs.build.outputs.wasm_sha256 }}"
          test "$rebuilt" = "${{ needs.build.outputs.wasm_sha256 }}"

  # After a merge: commit main's core, built and checked above, if it differs
  # from the committed one. Only a core that the published source archive
  # rebuilds byte for byte is committed. The push uses GITHUB_TOKEN, which does
  # not start another workflow run; it fails, harmlessly, if main moved while
  # this ran, and the run for the newer commit takes over.
  commit-core:
    needs: [build, rebuild-from-source-archive]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: commit-core
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.12.0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-${{ needs.build.outputs.wasm_sha256 }}
          path: core-artifact

      - name: Commit the core if it changed
        env:
          SHA256: ${{ needs.build.outputs.wasm_sha256 }}
        run: |
          cp core-artifact/dolphin-core-upstream.* cores/dolphin/
          cp core-artifact/dolphin-core-abi-v1.json provenance/
          cp core-artifact/upstream-worker-protocol.js src/
          rm -rf core-artifact
          node tools/core-artifacts.mjs status --require-current
          node tools/verify-dolphin-provenance.mjs > /dev/null
          if git diff --quiet; then
            echo "The committed core is already sha256:$SHA256."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cores/dolphin provenance/dolphin-core-abi-v1.json src/upstream-worker-protocol.js
          git commit -m "Build the core for $(git rev-parse --short HEAD)" \
            -m "sha256:$SHA256, built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} from the sources of ${GITHUB_SHA} and rebuilt identically from its GPL source archive."
          git push origin HEAD:main
