name: windows without GPU (software path and fallback chain, manual)

# What a player's Chrome does on a PC without a usable GPU, on a GitHub
# Windows runner (no GPU). Runs 1-3 (2026-10-23): without flags Chrome gives
# no WebGPU adapter; with --enable-unsafe-webgpu (the harness default) it
# gives a SwiftShader fallback adapter, never WARP/D3D12, and the wgpu device
# is lost there. So this lane cannot test Chrome's D3D12 path (that needs a
# Windows PC with a GPU). It checks the product's fallback instead: the
# engine refuses a fallback adapter, the WebGPU presenter falls back to
# WebGL (or 2D), and the software renderer runs on a Windows CPU.
#
# Manual only (workflow_dispatch), never on pull requests. No ROM: the
# homebrews are built from this repository's sources by the first job.
# Third-party actions are pinned by commit SHA, as in core-build.yml.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the homebrews (pinned devkitPPC image)
        run: sh harness/homebrew/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrews
          path: harness/homebrew/out/*.iso
          retention-days: 3

  nogpu:
    needs: homebrews
    runs-on: windows-2025
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrews
          path: harness/homebrew/out
      - name: Playwright (driver only; the runner's Chrome stable is used)
        run: npm i -g playwright@1.56.1
      - name: "No flag: no adapter, as a player's Chrome on a GPU-less PC"
        run: node harness/probes/webgpu-adapter.mjs --port 8102 --no-unsafe-webgpu --expect none --out webgpu-adapter-default.json
      - name: "Harness default (--enable-unsafe-webgpu): the fallback adapter"
        run: node harness/probes/webgpu-adapter.mjs --port 8102 --out webgpu-adapter-unsafe.json
      - name: "The product's software config: the fallback adapter is refused, WebGL presents"
        run: node harness/probes/presenter-check.mjs --iso harness/homebrew/out/gxscene.iso --port 8102 --query "core=upstream&video=software&presenter=webgpu&cpu=single&speed=1&wasmjit=0&fastsw=1" --expect-presenter webgl --out presenter-software.json
      - name: "Forced video=wgpu without a usable adapter fails before the core starts"
        run: node harness/probes/presenter-check.mjs --iso harness/homebrew/out/gxscene.iso --port 8102 --query "core=upstream&video=wgpu&presenter=webgpu&cpu=single&speed=1&wasmjit=0" --expect-boot-error "needs a usable WebGPU adapter" --out presenter-wgpu.json
      - name: Software renderer, WebGPU presenter refused (WebGL) and 2D
        run: node harness/cli.mjs matrix harness/matrices/windows-nogpu.json --port 8102
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-nogpu-results
          path: |
            webgpu-adapter-*.json
            presenter-*.json
            harness/results/
          retention-days: 14
