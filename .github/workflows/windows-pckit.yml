name: windows PC kit (salon-pc.ps1 on a real Windows)

# The PC kit's Windows side (harness/remote/pc-win, research/pc-windows-kit.md)
# on a GitHub Windows runner, before it meets the real PC: the script parses
# and lints clean under Windows PowerShell 5.1, its check reads this machine,
# the clamp's power scheme is created and fully undone (the scheme list and
# the processor settings as before), the bench page runs in Chrome and in
# Edge and tells Chrome from Chrome without optimizer (headless: no GPU, the
# timings mean nothing), and a scheduled task runs a job in the logged-on
# session. No disc, no game.
# Runs only when the kit changes.

on:
  pull_request:
    paths:
      - harness/remote/pc-win/**
      - harness/remote/pc-run.mjs
      - harness/lib/pc-kit.mjs
      - harness/lib/wasm-kernel.mjs
      - harness/probes/pc-bench.mjs
      - .github/workflows/windows-pckit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pckit:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Parse and lint under Windows PowerShell 5.1
        shell: powershell
        run: |
          $t = $null; $e = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD\harness\remote\pc-win\salon-pc.ps1", [ref]$t, [ref]$e)
          if ($e.Count) { $e | ForEach-Object { "$($_.Extent.StartLineNumber): $($_.Message)" }; exit 1 }
          if (Get-Module -ListAvailable PSScriptAnalyzer) {
            $r = Invoke-ScriptAnalyzer -Path harness\remote\pc-win\salon-pc.ps1 -Severity Error
            $r | Format-Table -AutoSize | Out-String -Width 200
            if ($r) { exit 1 }
          } else { "PSScriptAnalyzer not on this image: parse only" }
      - name: check (this machine as the kit sees it)
        shell: powershell
        run: |
          $o = powershell -NoProfile -ExecutionPolicy Bypass -File harness\remote\pc-win\salon-pc.ps1 -Action check -KitDir "$env:RUNNER_TEMP\salon-kit"
          $o | Select-Object -Last 1 | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\check.txt"
          $o | Select-Object -Last 1
      - name: Preflight reading of that check
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseKitJson, preflight, preflightMarkdown } from "./harness/lib/pc-kit.mjs";
            const c = parseKitJson(readFileSync(process.env.RUNNER_TEMP + "/check.txt", "utf8").replace(/^\uFEFF/, ""));
            if (!c?.cpu?.name || !c.power?.activeScheme) throw new Error("check gave no CPU or scheme");
            console.log(preflightMarkdown(preflight(c, { browsers: ["chrome", "msedge"] })));'
      - name: Snapshot, clamp, restore with the real powercfg; the machine as before
        shell: powershell
        run: |
          $k = "$env:RUNNER_TEMP\salon-kit"; $s = "harness\remote\pc-win\salon-pc.ps1"
          $before = (powercfg /list) -join "`n"; $active = (powercfg /getactivescheme) -join ""
          $o = @()
          # the runner has 2 cores: the class affinity is asked for 2
          $a = powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action affinity -Cores 2 -KitDir $k | Select-Object -Last 1
          $a
          if ($a -notmatch '"mask":"0x[0-9a-f]+"') { "no class affinity"; exit 1 }
          $o += powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action snapshot -Job ci1 -KitDir $k | Select-Object -Last 1
          $o += powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action clamp -Job ci1 -MaxMhz 2000 -StatePct 90 -KitDir $k | Select-Object -Last 1
          $mid = (powercfg /getactivescheme) -join ""
          $o += powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action restore -Job ci1 -KitDir $k | Select-Object -Last 1
          $o | Set-Content -Encoding UTF8 "$env:RUNNER_TEMP\roundtrip.txt"
          $o
          if ($mid -notmatch "5a10c0de-0b1d-4c1a-9e2f-12400c1a0001") { "the kit's scheme was not active while clamped: $mid"; exit 1 }
          if (((powercfg /list) -join "`n") -ne $before) { "scheme list changed"; exit 1 }
          if (((powercfg /getactivescheme) -join "") -ne $active) { "active scheme changed"; exit 1 }
      - name: The round trip's own diff is empty
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { parseKitJson, restoreDiff } from "./harness/lib/pc-kit.mjs";
            const lines = readFileSync(process.env.RUNNER_TEMP + "/roundtrip.txt", "utf8").replace(/^\uFEFF/, "").split(/\r?\n/).filter(Boolean);
            const [snap, clamp, restore] = lines.map((l) => parseKitJson(l));
            console.log(JSON.stringify(clamp.processor));
            if (clamp.processor.PROCFREQMAX?.ac !== 2000) throw new Error("PROCFREQMAX not set in the kit scheme");
            const d = restoreDiff(restore.before, restore.after, "ci1");
            if (d.length) throw new Error(d.join("; "));
            console.log("restored:", JSON.stringify(restore.after.activeScheme));'
      - name: Playwright (driver only; the runner's Chrome and Edge are used)
        shell: bash
        run: npm i -g playwright@1.56.1
      - name: "JIT tell under V8 flags (report only: which flags move the alu kernel)"
        continue-on-error: true
        shell: bash
        run: |
          for f in "" "--js-flags=--disable-optimizing-compilers" "--js-flags=--liftoff-only" "--js-flags=--no-liftoff"; do
            echo "== flags: ${f:-none}"
            HARNESS_CHROME_ARGS="$f" node harness/probes/pc-bench.mjs --runs 1 --warm-sec 2
          done
      - name: pc-bench in Chrome, Chrome without optimizer, Edge (headless; the page, the kernels and the JIT reading on Windows, not a timing)
        shell: bash
        run: |
          node harness/probes/pc-bench.mjs --runs 1 --warm-sec 2 --out "$RUNNER_TEMP/bench-chrome.json"
          HARNESS_CHROME_ARGS=--js-flags=--disable-optimizing-compilers node harness/probes/pc-bench.mjs --runs 1 --warm-sec 2 --out "$RUNNER_TEMP/bench-chrome-liftoff.json"
          HARNESS_BROWSER_CHANNEL=msedge node harness/probes/pc-bench.mjs --runs 1 --warm-sec 2 --out "$RUNNER_TEMP/bench-msedge.json"
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import { benchFindings } from "./harness/remote/pc-run.mjs";
            const r = (n) => JSON.parse(readFileSync(process.env.RUNNER_TEMP + "/" + n + ".json", "utf8"));
            const f = benchFindings({ "bench-chrome": r("bench-chrome"), "bench-chrome-liftoff": r("bench-chrome-liftoff"), "bench-msedge": r("bench-msedge") }, null);
            for (const x of f) console.log(x.name, x.score, JSON.stringify(x.jit), JSON.stringify(x.page));
            if (f.find((x) => x.browser === "chrome")?.jit.verdict !== "jit") throw new Error("Chrome not told apart from Chrome without optimizer: the bench cannot see an optimizer off");
            if (f.find((x) => x.browser === "msedge")?.jit.verdict !== "jit") throw new Error("the runner Edge is not read as jit");'
      - name: A job through the scheduled task, in the logged-on session
        timeout-minutes: 6
        shell: powershell
        run: |
          $k = "$env:RUNNER_TEMP\salon-kit"; $s = "$PWD\harness\remote\pc-win\salon-pc.ps1"
          # every call bounded and echoed: a hung one names itself
          function Kit([string[]]$a) {
            $j = Start-Job -ScriptBlock { param($s, $a) powershell -NoProfile -ExecutionPolicy Bypass -File $s @a 2>&1 | Select-Object -Last 1 } -ArgumentList $s, $a
            if (-not (Wait-Job $j -Timeout 60)) { Stop-Job $j; "TIMEOUT: $($a -join ' ')"; return }
            Receive-Job $j
          }
          New-Item -ItemType Directory -Force -Path "$k\jobs\ci2", "$k\node" | Out-Null
          Copy-Item (Get-Command node).Source "$k\node\node.exe"
          @{ cwd = "$PWD"; affinity = "0x3"; restoreAtEnd = $true; env = @{ X = "1" }; steps = @(@{ name = "hello"; args = @("-e", "console.log(process.env.X)"); env = @{}; continueOnError = $false }) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$k\jobs\ci2\spec.json"
          Kit @("-Action", "snapshot", "-Job", "ci2", "-KitDir", $k)
          Kit @("-Action", "start", "-Job", "ci2", "-KitDir", $k)
          $st = ""
          for ($i = 0; $i -lt 20; $i++) { Start-Sleep 3; $st = Kit @("-Action", "status", "-Job", "ci2", "-KitDir", $k); "[$i] $st"; if ($st -match '"state":"done"') { break } }
          Get-ChildItem "$k\jobs\ci2" | Format-Table Name, Length | Out-String
          Get-Content "$k\jobs\ci2\log" -ErrorAction SilentlyContinue
          Get-Content "$k\jobs\ci2\hello.out" -ErrorAction SilentlyContinue
          Kit @("-Action", "restore", "-Job", "ci2", "-KitDir", $k)
          if ($st -notmatch '"exit":0') { "the job did not exit 0"; exit 1 }
          if ((Get-Content "$k\jobs\ci2\hello.out") -ne "1") { "the spec's env did not reach the step"; exit 1 }
          if ((Get-Content "$k\jobs\ci2\log" -Raw) -notmatch 'session [1-9]') { "the task did not run in a user session"; exit 1 }
      - name: Restore in the middle of a running job stops it (the step killed, no further step, task gone)
        timeout-minutes: 4
        shell: powershell
        run: |
          $k = "$env:RUNNER_TEMP\salon-kit"; $s = "$PWD\harness\remote\pc-win\salon-pc.ps1"
          New-Item -ItemType Directory -Force -Path "$k\jobs\ci3" | Out-Null
          @{ cwd = "$PWD"; affinity = $null; restoreAtEnd = $true; env = @{}; steps = @(
            @{ name = "long"; args = @("-e", "setTimeout(() => {}, 600000)"); env = @{}; continueOnError = $true },
            @{ name = "after"; args = @("-e", "console.log(2)"); env = @{}; continueOnError = $false }) } | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 "$k\jobs\ci3\spec.json"
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action snapshot -Job ci3 -KitDir $k | Select-Object -Last 1
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action clamp -Job ci3 -MaxMhz 2000 -KitDir $k | Select-Object -Last 1
          powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action start -Job ci3 -KitDir $k | Select-Object -Last 1
          for ($i = 0; $i -lt 20 -and -not (Test-Path "$k\jobs\ci3\node.pid"); $i++) { Start-Sleep 1 }
          Start-Sleep 2
          $nodePid = [int]("$(Get-Content -Raw "$k\jobs\ci3\node.pid")".Trim() -split '\s+')[0]
          "node of the job: $nodePid"
          $r = powershell -NoProfile -ExecutionPolicy Bypass -File $s -Action restore -Job ci3 -KitDir $k | Select-Object -Last 1
          $r
          Start-Sleep 5
          Get-Content "$k\jobs\ci3\log" -ErrorAction SilentlyContinue
          if (Get-Process -Id $nodePid -ErrorAction SilentlyContinue) { "the job's node still runs"; exit 1 }
          if (Test-Path "$k\jobs\ci3\after.out") { "a step ran after the stop"; exit 1 }
          if (Get-ScheduledTask -TaskPath "\SalonKit\" -ErrorAction SilentlyContinue | Where-Object { $_.TaskName -match 'ci3' }) { "a ci3 task is still registered"; exit 1 }
          if (((powercfg /getactivescheme) -join "") -match "5a10c0de") { "the clamp is still active"; exit 1 }
          if ($r -notmatch '"jobTmp":false') { "the job TEMP was not removed"; exit 1 }
      - name: The power round trip under a standard (non-admin) account (report only)
        continue-on-error: true
        timeout-minutes: 4
        shell: powershell
        run: |
          $pw = "Kit-" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "!a1"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name kitstd -Password $sec -AccountNeverExpires | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\kitstd", $sec)
          $k = "C:\kitstd-kit"; New-Item -ItemType Directory -Force -Path $k | Out-Null
          Copy-Item harness\remote\pc-win\salon-pc.ps1 "$k\salon-pc.ps1"
          icacls $k /grant "kitstd:(OI)(CI)F" | Out-Null
          $cmd = "& '$k\salon-pc.ps1' -Action snapshot -Job std1 -KitDir '$k' | Select-Object -Last 1; & '$k\salon-pc.ps1' -Action clamp -Job std1 -MaxMhz 2000 -KitDir '$k' 2>&1 | Select-Object -Last 1; & '$k\salon-pc.ps1' -Action restore -Job std1 -KitDir '$k' | Select-Object -Last 1"
          $p = Start-Process powershell.exe -Credential $cred -LoadUserProfile -ArgumentList "-NoProfile -ExecutionPolicy Bypass -Command `"$cmd *> $k\out.txt`"" -WorkingDirectory $k -Wait -PassThru
          "exit $($p.ExitCode)"
          Get-Content "$k\out.txt" -ErrorAction SilentlyContinue
          Remove-LocalUser -Name kitstd
      - name: The securing script, as pc-run sends it
        shell: bash
        run: node --input-type=module -e 'import { secureKitScript } from "./harness/lib/pc-kit.mjs"; process.stdout.write(secureKitScript());' > "$RUNNER_TEMP/secure.ps1"
      - name: "Security: C:\\salon-kit secured; a standard account cannot rewrite the script; an elevated cleanup does not follow a junction; the logon restore runs no file"
        timeout-minutes: 6
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\secure.ps1"
          Copy-Item harness\remote\pc-win\salon-pc.ps1 C:\salon-kit\salon-pc.ps1
          $a = Get-Acl C:\salon-kit; "protected: $($a.AreAccessRulesProtected), owner: $($a.Owner)"; $a.Access | Format-Table IdentityReference, FileSystemRights, IsInherited | Out-String
          if (-not $a.AreAccessRulesProtected) { "inheritance not cut"; exit 1 }
          $ca = Get-Acl C:\salon-kit\salon-pc.ps1
          if (@($ca.Access | Where-Object { "$($_.IdentityReference)" -match 'Users|Authenticated|Everyone' }).Count) { "the script grants a broad group"; $ca.Access | Format-Table | Out-String; exit 1 }
          # a standard account: rewriting the script must be refused
          $pw = "Kit-" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "!a1"; $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name kitstd2 -Password $sec -AccountNeverExpires | Out-Null
          $cred = New-Object System.Management.Automation.PSCredential("$env:COMPUTERNAME\kitstd2", $sec)
          New-Item -ItemType Directory -Force -Path C:\kitstd2-out | Out-Null; icacls C:\kitstd2-out /grant "kitstd2:(OI)(CI)F" | Out-Null
          $p = Start-Process powershell.exe -Credential $cred -LoadUserProfile -WorkingDirectory C:\kitstd2-out -ArgumentList '-NoProfile -Command "$(try { Add-Content -LiteralPath C:\salon-kit\salon-pc.ps1 -Value pwned -ErrorAction Stop; ''WROTE'' } catch { ''DENIED'' }) | Out-File C:\kitstd2-out\w.txt"' -Wait -PassThru
          $w = (Get-Content C:\kitstd2-out\w.txt -Raw).Trim(); "standard account writing the script: $w"
          Remove-LocalUser -Name kitstd2
          if ($w -ne "DENIED") { "a standard account could write the kit script"; exit 1 }
          # a junction planted in a job's TEMP: the elevated cleanup removes the link only
          New-Item -ItemType Directory -Force -Path C:\sentinel | Out-Null; Set-Content C:\sentinel\keep.txt keep
          New-Item -ItemType Directory -Force -Path C:\salon-kit\jobs\ci6\tmp | Out-Null
          cmd /c mklink /J C:\salon-kit\jobs\ci6\tmp\evil C:\sentinel | Out-Null
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\salon-kit\salon-pc.ps1 -Action cleanup -Job ci6 | Select-Object -Last 1
          if (-not (Test-Path C:\sentinel\keep.txt)) { "the cleanup followed the junction"; exit 1 }
          if (Test-Path C:\salon-kit\jobs\ci6\tmp) { "the job tmp is still there"; exit 1 }
          # securing again refuses a reparse point inside the kit
          cmd /c mklink /J C:\salon-kit\jobs\planted C:\sentinel | Out-Null
          $ErrorActionPreference = "Continue"  # the refusal comes on stderr, expected
          $r = powershell -NoProfile -ExecutionPolicy Bypass -File "$env:RUNNER_TEMP\secure.ps1" 2>&1 | Out-String
          $ErrorActionPreference = "Stop"
          if ($r -notmatch "reparse points") { "a planted junction was not refused: $r"; exit 1 }
          [IO.Directory]::Delete("C:\salon-kit\jobs\planted", $false)
          # the logon restore task: a self-contained command, and it restores
          $orig = ((powercfg /getactivescheme) -join "") -replace '.*([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}).*', '$1'
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\salon-kit\salon-pc.ps1 -Action snapshot -Job ci7 | Select-Object -Last 1
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\salon-kit\salon-pc.ps1 -Action clamp -Job ci7 -MaxMhz 2000 | Select-Object -Last 1
          $t = Get-ScheduledTask -TaskPath "\SalonKit\" -TaskName restore-ci7
          $argLine = $t.Actions[0].Arguments; "logon task: $($t.Actions[0].Execute) $($argLine.Substring(0, [Math]::Min(80, $argLine.Length)))..."
          if ($argLine -match '\.ps1|-File') { "the elevated logon task runs a file"; exit 1 }
          if ("$($t.Principal.RunLevel)" -ne "Highest") { "logon task not elevated: $($t.Principal.RunLevel)"; exit 1 }
          Start-ScheduledTask -TaskPath "\SalonKit\" -TaskName restore-ci7
          for ($i = 0; $i -lt 30 -and (Get-ScheduledTask -TaskPath "\SalonKit\" -TaskName restore-ci7 -ErrorAction SilentlyContinue); $i++) { Start-Sleep 1 }
          $now = (powercfg /getactivescheme) -join ""
          "after the logon task: $now"
          if ($now -notmatch $orig) { "the logon task did not restore the scheme"; exit 1 }
          if (((powercfg /list) -join "") -match "5a10c0de") { "the kit's scheme survived the logon task"; exit 1 }
          if (Get-ScheduledTask -TaskPath "\SalonKit\" -TaskName restore-ci7 -ErrorAction SilentlyContinue) { "the logon task did not unregister itself"; exit 1 }
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\salon-kit\salon-pc.ps1 -Action restore -Job ci7 | Select-Object -Last 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: windows-pckit
          path: |
            ${{ runner.temp }}/check.txt
            ${{ runner.temp }}/roundtrip.txt
            ${{ runner.temp }}/bench-*.json
            ${{ runner.temp }}/salon-kit/jobs/ci2
          retention-days: 7
