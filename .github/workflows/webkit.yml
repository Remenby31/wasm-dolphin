name: WebKit (JavaScriptCore, Safari's engine) homebrew boot with aot=1, manual

# Safari and iOS run JavaScriptCore, not V8. This lane boots homebrew .dol
# files with aot=1 in Playwright's WebKit on a macOS arm64 runner (the
# closest to an iPhone) and checks what Chromium only tells for V8:
#   - the relaxed SIMD probe answers "unsupported" (WebKit has no relaxed
#     SIMD) and the core keeps its exact FP path;
#   - region modules compile and install in JSC (installs > 0, 0 refused,
#     0 compile errors) and run (region calls > 0);
#   - no region function passes JSC's 100,000-byte OMG cap (measured on the
#     exact path, which is the code Safari gets: Chromium with fusedmadd=0).
# Chromium boots the same files first, to calibrate. Speed is only an
# indication (video=software, headless).
#
# Manual only (workflow_dispatch). No ROM: the homebrews are built from this
# repository's sources. Third-party actions are pinned by commit SHA.

on:
  workflow_dispatch:
  push: # TEMPORARY, removed before the PR
    branches: [harness/webkit-lane]

permissions:
  contents: read

jobs:
  homebrews:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build the homebrews (pinned devkitPPC image)
        run: sh harness/homebrew/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-dols
          path: harness/homebrew/out/*.dol
          retention-days: 3

  webkit:
    needs: homebrews
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: homebrew-dols
          path: harness/homebrew/out
      - name: Playwright with its WebKit and Chromium builds
        run: npm i -g playwright@1.56.1 && npx -y playwright@1.56.1 install webkit chromium
      - name: "Chromium calibration: regions install and run"
        timeout-minutes: 15
        run: |
          for p in dstalpha footprint cpufuzz; do
            node harness/probes/webkit-boot.mjs --browser chromium --dol harness/homebrew/out/$p.dol --port 8102 --secs 40 --expect-installs --expect-relaxed fused --out webkit-boot-chromium-$p.json
          done
      - name: "WebKit: relaxed SIMD unsupported, regions install, compile and run in JSC"
        timeout-minutes: 15
        run: |
          for p in dstalpha footprint cpufuzz; do
            node harness/probes/webkit-boot.mjs --browser webkit --dol harness/homebrew/out/$p.dol --port 8102 --secs 40 --expect-installs --expect-relaxed unsupported --out webkit-boot-webkit-$p.json
          done
      - name: "Region function sizes on the exact path (Safari's code) against JSC's OMG cap"
        timeout-minutes: 15
        run: |
          for p in footprint cpufuzz; do
            node harness/probes/webkit-boot.mjs --browser chromium --dol harness/homebrew/out/$p.dol --port 8102 --secs 40 --module-sizes --query "core=upstream&video=software&presenter=2d&cpu=single&speed=1&wasmjit=1&aot=1&metrics=1&fusedmadd=0" --out webkit-sizes-$p.json
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: webkit-results
          path: webkit-*.json
          retention-days: 14
